- name: List hosts
  ntnx_hosts_info:
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: false
    kind: host
  register: result

- name: test getting particular host using uuid
  ntnx_hosts_info:
    nutanix_host: "{{ ip }}"
    nutanix_username: "{{ username }}"
    nutanix_password: "{{ password }}"
    validate_certs: false
    host_uuid: <host-uuid>
  register: result
